<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino Dinamico Leo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap');
:root{--bg:#0d0f0b;--s1:#141710;--card:#1e2419;--green:#b5e550;--orange:#ff6b35;--blue:#5bc4e8;--red:#ff4d4d;--yellow:#ffc93c;--muted:#697060;--text:#d8e8c4;--border:rgba(181,229,80,0.08);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;min-height:100vh;}
header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--s1);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--green);}
.logo span{color:var(--muted);font-size:10px;font-family:'Outfit',sans-serif;font-weight:400;letter-spacing:0;display:block;margin-top:-2px;}
.tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border);}
.tab-btn{flex:1;padding:13px;background:none;border:none;color:var(--muted);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);}
.app{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 104px);}
.sidebar{background:var(--s1);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;}
.sidebar-title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1px;margin-bottom:3px;}
.sidebar-sub{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.4;}
.pain-list{display:flex;flex-direction:column;gap:5px;}
.pain-item{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 11px;cursor:pointer;transition:all .2s;}
.pain-item:hover{border-color:rgba(181,229,80,.2);}
.pain-item.checked{border-color:var(--red);background:rgba(255,77,77,.07);}
.pain-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid var(--border);}
.pain-item.checked .pain-dot{background:rgba(255,77,77,.15);border-color:rgba(255,77,77,.4);}
.pain-name{font-weight:600;font-size:12px;flex:1;}
.pain-check{width:17px;height:17px;border-radius:4px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;}
.pain-item.checked .pain-check{background:var(--red);border-color:var(--red);color:#fff;}
.clear-btn{width:100%;margin-top:10px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px;border-radius:7px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:12px;transition:all .2s;}
.clear-btn:hover{border-color:var(--green);color:var(--green);}
.legend{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px;}
.legend-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:4px;}
.ldot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.main{padding:20px 24px;overflow-y:auto;}
.day-selector{display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap;}
.day-btn{padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;line-height:1.4;}
.day-btn:hover{color:var(--text);}
.day-btn.active{background:rgba(181,229,80,.12);border-color:var(--green);color:var(--green);}
.day-btn.rest-d.active{background:rgba(105,112,96,.15);border-color:var(--muted);color:var(--text);}
.status-bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:16px;}
.status-main{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;color:var(--green);line-height:1;}
.status-main.red{color:var(--red);}
.status-main.yellow{color:var(--yellow);}
.status-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.status-right{margin-left:auto;text-align:right;}
.stat-big{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--orange);}
.stat-lbl{font-size:10px;color:var(--muted);}
.warning-strip{border-radius:8px;padding:9px 13px;margin-bottom:11px;border-left:3px solid;font-size:12px;display:flex;gap:9px;align-items:flex-start;}
.ws-red{background:rgba(255,77,77,.08);border-color:var(--red);}
.ws-yellow{background:rgba(255,201,60,.08);border-color:var(--yellow);}
.ws-green{background:rgba(181,229,80,.08);border-color:var(--green);}
.comp-bar-wrap{margin:0 0 14px;}
.comp-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.comp-fill{height:100%;background:linear-gradient(90deg,var(--green),#d4ff7a);border-radius:3px;transition:width .5s ease;}
.comp-text{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;}
.sec-head{display:flex;align-items:center;gap:10px;margin:18px 0 11px;}
.sec-head-line{flex:1;height:1px;background:var(--border);}
.sec-head-title{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;color:var(--muted);white-space:nowrap;}
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:7px;transition:border-color .2s;}
.ex-card.blocked{opacity:.35;border-color:rgba(255,77,77,.2);}
.ex-card.substituted{border-color:rgba(255,201,60,.2);}
.ex-card-header{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;user-select:none;}
.ex-card-header:hover{background:rgba(255,255,255,.02);}
.ex-num{width:28px;height:28px;border-radius:6px;background:rgba(181,229,80,.1);color:var(--green);font-family:'Bebas Neue',sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ex-card.blocked .ex-num{background:rgba(255,77,77,.1);color:var(--red);}
.ex-card.substituted .ex-num{background:rgba(255,201,60,.1);color:var(--yellow);}
.ex-info{flex:1;min-width:0;}
.ex-name{font-weight:600;font-size:13px;line-height:1.2;}
.ex-card.blocked .ex-name{text-decoration:line-through;color:var(--muted);}
.ex-meta{display:flex;gap:7px;margin-top:3px;align-items:center;flex-wrap:wrap;}
.ex-sets{font-size:11px;color:var(--muted);}
.ex-tag{font-size:9px;font-weight:700;letter-spacing:.7px;padding:2px 6px;border-radius:20px;text-transform:uppercase;}
.tag-green{background:rgba(181,229,80,.12);color:var(--green);}
.tag-red{background:rgba(255,77,77,.12);color:var(--red);}
.tag-yellow{background:rgba(255,201,60,.12);color:var(--yellow);}
.ex-expand{font-size:11px;color:var(--muted);transition:transform .2s;flex-shrink:0;margin-left:4px;}
.ex-expand.open{transform:rotate(180deg);}
.ex-done-icon{font-size:15px;flex-shrink:0;}
.ex-detail{display:none;border-top:1px solid var(--border);}
.ex-detail.open{display:block;}
.ex-illustration{padding:14px 14px 8px;text-align:center;background:rgba(0,0,0,.25);}
.ex-illustration svg{max-width:260px;width:100%;border-radius:6px;}
.ex-note-text{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5;}
.ex-reason{padding:7px 13px 9px;font-size:11px;color:var(--red);}
.ex-sub-reason{padding:7px 13px 9px;font-size:11px;color:var(--yellow);}
.ex-done-btn{margin:8px 13px 11px;padding:9px;background:rgba(181,229,80,.1);border:1px solid rgba(181,229,80,.2);color:var(--green);border-radius:8px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;width:calc(100% - 26px);transition:all .2s;}
.ex-done-btn:hover{background:rgba(181,229,80,.18);}
.ex-done-btn.done{background:rgba(181,229,80,.22);border-color:var(--green);}
.blocked-banner{background:rgba(255,77,77,.06);border:1px solid rgba(255,77,77,.2);border-radius:10px;padding:16px 18px;margin-bottom:18px;}
.bb-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--red);margin-bottom:5px;}
.bb-alts{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap;}
.bb-alt{background:rgba(91,196,232,.1);border:1px solid rgba(91,196,232,.2);color:var(--blue);padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;}
.rest-content{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;}
.mob-item{display:flex;gap:9px;align-items:center;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:7px;padding:9px 11px;margin-bottom:6px;}
.mob-sets{font-size:11px;color:var(--green);font-weight:600;min-width:65px;}
.mob-name{font-size:12px;}
.mob-focus{font-size:11px;color:var(--muted);}
.history-wrap{padding:22px 26px;}
.hist-empty{text-align:center;padding:50px 20px;color:var(--muted);}
.hist-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:10px;}
.hist-date{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--green);}
.hist-type{font-size:11px;color:var(--muted);margin-bottom:8px;}
.hist-badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;display:inline-block;margin:2px;}
.hb-done{background:rgba(181,229,80,.12);color:var(--green);}
.hb-pain{background:rgba(255,201,60,.12);color:var(--yellow);}
.hist-stats{display:flex;gap:18px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.hist-stat-val{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--orange);}
.hist-stat-lbl{font-size:10px;color:var(--muted);}
.week-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.ws-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.ws-val{font-family:'Bebas Neue',sans-serif;font-size:30px;}
.ws-lbl{font-size:11px;color:var(--muted);margin-top:1px;}
.clear-hist-btn{background:transparent;border:1px solid rgba(255,77,77,.3);color:var(--red);padding:7px 14px;border-radius:7px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:12px;margin-bottom:18px;}
.save-btn{width:100%;margin-top:10px;padding:11px;background:rgba(181,229,80,.15);border:1px solid var(--green);color:var(--green);border-radius:9px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{border-right:none;border-bottom:1px solid var(--border);}.main,.history-wrap{padding:16px 12px;}.week-summary{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<header>
  <div class="logo">LEO TREINO<span>Dinamico · Ilustrado · Com Historico</span></div>
  <div style="font-size:11px;color:var(--muted);text-align:right"><strong id="hdate" style="color:var(--text);display:block;font-size:12px"></strong>Programa 12 semanas</div>
</header>
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('treino',this)">Treino de Hoje</button>
  <button class="tab-btn" onclick="showTab('history',this)">Historico</button>
</div>
<div id="tab-treino">
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-title">O que doi hoje?</div>
      <div class="sidebar-sub">Marque as regioes com dor. O treino se adapta automaticamente.</div>
      <div class="pain-list" id="pain-list"></div>
      <button class="clear-btn" onclick="clearAll()">Limpar selecao</button>
      <div class="legend">
        <div class="legend-title">Legenda</div>
        <div class="legend-item"><span class="ldot" style="background:var(--green)"></span> Liberado</div>
        <div class="legend-item"><span class="ldot" style="background:var(--yellow)"></span> Substituto seguro</div>
        <div class="legend-item"><span class="ldot" style="background:var(--red)"></span> Bloqueado</div>
      </div>
    </aside>
    <main class="main" id="main-area"></main>
  </div>
</div>
<div id="tab-history" style="display:none">
  <div class="history-wrap" id="history-wrap"></div>
</div>

  ]},
  B:{label:'PULL + CORE',type:'Costas · Biceps · Core',duration:45,kcal:270,exercises:[
    {id:'remada_baixa',name:'Remada baixa cabo (chave lombar)',sets:'3x12',focus:'Costas / postura',risks:['lowerback','upperback','elbow','forearm','wrist','shoulder'],tip:'Nao curve a lombar no final. Cotovelos perto do corpo, puxar ate o umbigo.',sub:{name:'Remada maquina apoiada (chest supported)',sets:'3x12',reason:'Lombar descarregada completamente'}},
    {id:'pulldown',name:'Pulldown barra larga',sets:'3x12',focus:'Lat / largura',risks:['shoulder','elbow','forearm','wrist'],tip:'Deixa o ombro descer ao final da subida. Puxa ate o queixo.',sub:{name:'Pulldown neutro (triangulo)',sets:'3x12',reason:'Posicao mais segura para o manguito'}},
    {id:'remada_uni',name:'Remada unilateral halter',sets:'3x12',focus:'Costas + core',risks:['lowerback','elbow','forearm','wrist'],tip:'Apoio solido no banco. Nao gire o tronco. Puxe ate o quadril.',sub:{name:'Remada unilateral no cabo em pe',sets:'3x12',reason:'Menor torque na lombar'}},
    {id:'rosca_ez',name:'Rosca barra EZ',sets:'3x12',focus:'Biceps',risks:['elbow','forearm','wrist'],tip:'Cotovelos fixos ao lado do corpo. Sem balanco do tronco.',sub:{name:'Rosca alternada halteres neutro',sets:'3x12',reason:'Pulso em posicao neutra, alivia cotovelo'}},
    {id:'deadbug',name:'Deadbug core (chave lombar)',sets:'3x8 cada',focus:'Anti-extensao lombar',risks:['abs','lowerback'],tip:'COLUNA NO CHAO o tempo todo. Expira ao esticar braco e perna opostos.',sub:{name:'Marcha supina lenta',sets:'3x10 cada',reason:'Mesma ativacao, menos exigencia'}},
    {id:'prancha',name:'Prancha frontal',sets:'3x30s',focus:'Core geral',risks:['abs','lowerback','shoulder','wrist'],tip:'Corpo em linha reta. Quadril nao sobe nem desce. Respira normalmente.',sub:{name:'Prancha em cotovelos (low plank)',sets:'3x30s',reason:'Sem carga nos pulsos, mesma ativacao'}},
  ]},
  C:{label:'LEGS',type:'Quadriceps · Gluteo · Posterior',duration:45,kcal:320,exercises:[
    {id:'agachamento',name:'Agachamento goblet halter',sets:'3x12',focus:'Quadriceps / gluteo',risks:['knee','hip','groin','quadriceps','lowerback','ankle'],tip:'Joelhos seguem a linha dos dedos dos pes. Costas retas. Desça devagar.',sub:{name:'Leg press 45 graus (amplitude reduzida)',sets:'3x15',reason:'Sem compressao axial na coluna'}},
    {id:'legpress',name:'Leg press 45 graus',sets:'3x15',focus:'Quadriceps completo',risks:['knee','hip','quadriceps','lowerback'],tip:'Pes paralelos largos. Nao fecha os joelhos. Para antes de travar.',sub:{name:'Cadeira extensora (parcial)',sets:'3x15',reason:'Isola quad sem envolver lombar'}},
    {id:'mesa_flex',name:'Mesa flexora (chave lombar)',sets:'3x15',focus:'Isquiotibiais',risks:['knee','hip','hamstring'],tip:'Movimento controlado sem balanco. Isquio fraco = dor lombar.',sub:{name:'Stiff halter leve (amplitude reduzida)',sets:'3x12',reason:'Ativa isquio sem comprimir o joelho'}},
    {id:'hip_thrust',name:'Hip thrust / Glute bridge (chave gluteo)',sets:'3x15',focus:'Gluteo = protege lombar',risks:['lowerback','hip','knee','hamstring'],tip:'Ombros apoiados no banco. Esprema o gluteo no topo. Pausa 1 segundo.',sub:{name:'Glute bridge no chao sem peso',sets:'3x20',reason:'Mesmo padrao, sem carga axial'}},
    {id:'cadeira_ext',name:'Cadeira extensora',sets:'3x15',focus:'Quadriceps isolado',risks:['knee','quadriceps'],tip:'Nao trava o joelho. Para a 10 graus do final para proteger patela.',sub:{name:'Mini-squat isometrico na parede',sets:'3x30s',reason:'Ativa quad sem pico de carga patelar'}},
    {id:'panturrilha',name:'Panturrilha em pe',sets:'3x20',focus:'Gastrocnemio / tornozelo',risks:['ankle','knee','calf','foot'],tip:'Sobe na ponta do pe. Amplitude total. Pausa 1 segundo em cima.',sub:{name:'Panturrilha sentado maquina',sets:'3x20',reason:'Menos estresse no tornozelo e Aquiles'}},
  ]},
  BIKE:{label:'BICICLETA',type:'Cardio · Queima de gordura',duration:45,kcal:420,exercises:[
    {id:'bike_road',name:'Bicicleta continua (rua ou ergometrica)',sets:'40-50 min',focus:'Cardio aerobico',risks:['ankle','knee','calf','quadriceps','hamstring'],tip:'18-22 km/h. Pace confortavel. Ergometrica em casa e opcao valida.',sub:{name:'Ergometrica em casa (ritmo leve)',sets:'40 min',reason:'Zero impacto no tornozelo e joelho'}},
  ]},
  REST:{label:'DESCANSO',type:'Recuperacao ativa',duration:20,kcal:80,exercises:[]},
};
const WEEK_MAP={0:'REST',1:'A',2:'BIKE',3:'REST',4:'B',5:'C',6:'BIKE'};
const DAY_SHORT=['DOM','SEG','TER','QUA','QUI','SEX','SAB'];
let activePain=new Set(),selectedDay=new Date().getDay(),doneEx=new Set(),openCards=new Set();
function getHistory(){try{return JSON.parse(localStorage.getItem('leo_h')||'[]');}catch{return[];}}
function saveHistory(h){try{localStorage.setItem('leo_h',JSON.stringify(h));}catch{}}
document.addEventListener('DOMContentLoaded',()=>{
  const d=new Date();
  document.getElementById('hdate').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  buildPain();renderWorkout();
});
function showTab(t,btn){
  document.getElementById('tab-treino').style.display=t==='treino'?'block':'none';
  document.getElementById('tab-history').style.display=t==='history'?'block':'none';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(t==='history')renderHistory();
}
function buildPain(){
  document.getElementById('pain-list').innerHTML=PAIN_ZONES.map(z=>`
    <div class="pain-item ${activePain.has(z.id)?'checked':''}" onclick="togglePain('${z.id}')">
      <div class="pain-dot">${z.emoji}</div>
      <div class="pain-name">${z.name}</div>
      <div class="pain-check">${activePain.has(z.id)?'✓':''}</div>
    </div>`).join('');
}
function togglePain(id){
  if(activePain.has(id))activePain.delete(id);else activePain.add(id);
  doneEx.clear();openCards.clear();buildPain();renderWorkout();
}
function clearAll(){activePain.clear();doneEx.clear();openCards.clear();buildPain();renderWorkout();}
function selectDay(i){selectedDay=i;doneEx.clear();openCards.clear();renderWorkout();}
function toggleCard(id){if(openCards.has(id))openCards.delete(id);else openCards.add(id);renderWorkout();}
function toggleDone(e,id){e.stopPropagation();if(doneEx.has(id))doneEx.delete(id);else doneEx.add(id);renderWorkout();}
function finishSession(){
  const wk=WORKOUTS[WEEK_MAP[selectedDay]];
  const active=wk.exercises.filter(ex=>ex.risks.filter(r=>activePain.has(r)).length===0||ex.sub);
  const h=getHistory();
  h.unshift({
    date:new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),
    ts:Date.now(),workout:wk.label,type:wk.type,
    done:doneEx.size,total:active.length,kcal:wk.kcal,duration:wk.duration,
    pains:[...activePain].map(id=>PAIN_ZONES.find(z=>z.id===id)?.name).filter(Boolean)
  });
  if(h.length>60)h.pop();
  saveHistory(h);doneEx.clear();openCards.clear();renderWorkout();
  alert('Treino salvo no historico!');
}
function renderWorkout(){
  const main=document.getElementById('main-area');
  const wkey=WEEK_MAP[selectedDay];
  const wk=WORKOUTS[wkey];
  let html=`<div class="day-selector">${DAY_SHORT.map((d,i)=>{
    const k=WEEK_MAP[i];
    return`<button class="day-btn ${i===selectedDay?'active':''} ${k==='REST'?'rest-d':''}" onclick="selectDay(${i})">${d}<br><span style="font-size:9px;font-weight:400;opacity:.5">${k==='REST'?'desc':k==='BIKE'?'bike':'treino'}</span></button>`;
  }).join('')}</div>`;
  if(wkey==='REST'){html+=renderRest();main.innerHTML=html;return;}
  const analyzed=wk.exercises.map(ex=>{
    const c=ex.risks.filter(r=>activePain.has(r));
    return{...ex,status:c.length===0?'safe':(ex.sub?'substituted':'blocked')};
  });
  const blocked=analyzed.filter(e=>e.status==='blocked').length;
  const subst=analyzed.filter(e=>e.status==='substituted').length;
  const active=analyzed.filter(e=>e.status!=='blocked');
  const allBlocked=active.length===0&&wk.exercises.length>0;
  let sIcon='✅',sText=wk.label,sClass='';
  if(activePain.size>0&&allBlocked){sIcon='🚫';sText='TREINO BLOQUEADO';sClass='red';}
  else if(activePain.size>0&&(blocked>0||subst>0)){sIcon='⚠️';sText=wk.label+' ADAPTADO';sClass='yellow';}
  html+=`<div class="status-bar">
    <div style="font-size:22px">${sIcon}</div>
    <div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">${wk.type}</div>
    <div class="status-main ${sClass}">${sText}</div>
    <div class="status-sub">${wk.duration} min · ${wk.kcal} kcal</div></div>
    <div class="status-right"><div class="stat-big">${doneEx.size}/${active.length}</div><div class="stat-lbl">concluidos</div></div>
  </div>`;
  if(activePain.size>0){
    const names=[...activePain].map(id=>PAIN_ZONES.find(z=>z.id===id)?.name).filter(Boolean);
    html+=`<div class="warning-strip ws-red"><span>⚠️</span><div><strong>Dor: ${names.join(', ')}</strong> — ${blocked} removido · ${subst} substituido · ${active.length-subst} ok</div></div>`;
  }
  if(allBlocked){
    html+=`<div class="blocked-banner"><div class="bb-title">TREINO INCOMPATIVEL</div>
    <div style="font-size:12px;color:var(--muted)">Suas dores afetam todos os exercicios. Tente:</div>
    <div class="bb-alts"><div class="bb-alt">Ergometrica em casa</div><div class="bb-alt">Mobilidade 20 min</div></div></div>`;
  }
  if(!allBlocked){
    const pct=active.length?Math.round(doneEx.size/active.length*100):0;
    html+=`<div class="comp-bar-wrap"><div class="comp-bar"><div class="comp-fill" style="width:${pct}%"></div></div>
    <div class="comp-text"><span>Progresso da sessao</span><span>${doneEx.size}/${active.length} · ${pct}%</span></div></div>
    <div class="sec-head"><div class="sec-head-title">TOQUE NO EXERCICIO PARA VER COMO FAZER</div><div class="sec-head-line"></div></div>`;
    analyzed.forEach((ex,i)=>{
      const isDone=doneEx.has(ex.id);
      const isOpen=openCards.has(ex.id);
      const dispName=ex.status==='substituted'?ex.sub.name:ex.name;
      const dispSets=ex.status==='substituted'?ex.sub.sets:ex.sets;
      const svgKey=ex.id in SVG?ex.id:'default_ex';
      if(ex.status==='blocked'){
        html+=`<div class="ex-card blocked">
          <div class="ex-card-header" style="cursor:default">
            <div class="ex-num">✕</div>
            <div class="ex-info"><div class="ex-name">${ex.name}</div>
              <div class="ex-meta"><span class="ex-sets">${ex.sets}</span><span class="ex-tag tag-red">BLOQUEADO</span></div>
            </div>
          </div>
          <div class="ex-reason">Agrava: ${ex.risks.filter(r=>activePain.has(r)).map(r=>PAIN_ZONES.find(z=>z.id===r)?.name).join(', ')}</div>
        </div>`;
        return;
      }
      html+=`<div class="ex-card ${ex.status}" id="ec_${ex.id}">
        <div class="ex-card-header" onclick="toggleCard('${ex.id}')">
          <div class="ex-num" style="${isDone?'background:rgba(181,229,80,.2);color:var(--green)':''}">${isDone?'✓':i+1}</div>
          <div class="ex-info">
            <div class="ex-name" style="${isDone?'opacity:.45':''}">${dispName}</div>
            <div class="ex-meta"><span class="ex-sets">${dispSets} · ${ex.focus}</span>
              ${ex.status==='substituted'?'<span class="ex-tag tag-yellow">SUBSTITUTO</span>':'<span class="ex-tag tag-green">LIBERADO</span>'}
            </div>
          </div>
          <div class="ex-done-icon">${isDone?'✅':'○'}</div>
          <div class="ex-expand ${isOpen?'open':''}">▼</div>
        </div>
        <div class="ex-detail ${isOpen?'open':''}">
          ${ex.status==='substituted'?`<div class="ex-sub-reason">Substituido: "${ex.sub.reason}"</div>`:''}
          <div class="ex-illustration">${SVG[svgKey]||''}
            ${ex.tip?`<div class="ex-note-text">${ex.tip}</div>`:''}
          </div>
          <button class="ex-done-btn ${isDone?'done':''}" onclick="toggleDone(event,'${ex.id}')">
            ${isDone?'Concluido (toque para desfazer)':'Marcar como feito'}
          </button>
        </div>
      </div>`;
    });
    if(doneEx.size===active.length&&active.length>0){
      html+=`<div class="warning-strip ws-green" style="margin-top:14px"><span>🎉</span>
        <div><strong>Treino concluido!</strong> Proteina em ate 60 min. Beba 500ml de agua.</div>
      </div>
      <button class="save-btn" onclick="finishSession()">Salvar no Historico</button>`;
    }
  }
  main.innerHTML=html;
}
function renderRest(){
  return`<div class="rest-content">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--muted);margin-bottom:6px">DESCANSO</div>
    <p style="color:var(--muted);font-size:12px;margin-bottom:14px">Recuperacao e onde o corpo se transforma. Sem culpa.</p>
    ${activePain.size>0?`<div class="warning-strip ws-yellow"><span>💡</span><div>Dores marcadas. Aplique gelo 15 min nas regioes e evite cargas nas areas afetadas.</div></div>`:''}
    <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--muted);letter-spacing:1px;margin:14px 0 10px">MOBILIDADE OPCIONAL (15-20 min)</div>
    ${[{n:'Cat-Cow',s:'2x10',f:'Mobilidade lombar'},{n:'Hip 90/90',s:'2x45s cada',f:'Quadril'},{n:'Couch Stretch',s:'2x45s cada',f:'Iliopsoas (sedentarismo)'},{n:"World Greatest Stretch",s:'3 cada',f:'Quadril + toracica'},{n:'Deadbug lento',s:'2x8 cada',f:'Core suave'},{n:'Circulos de tornozelo',s:'2x15 cada',f:'Tornozelo (gota)'}].map(m=>`<div class="mob-item"><div class="mob-sets">${m.s}</div><div><div class="mob-name">${m.n}</div><div class="mob-focus">${m.f}</div></div></div>`).join('')}
  </div>`;
}
function renderHistory(){
  const h=getHistory();
  const wrap=document.getElementById('history-wrap');
  if(h.length===0){
    wrap.innerHTML=`<div style="font-family:'Bebas Neue',sans-serif;font-size:26px;margin-bottom:4px">HISTORICO</div>
    <div class="hist-empty">Nenhum treino salvo ainda.<br>Complete uma sessao e clique em "Salvar no Historico".</div>`;
    return;
  }
  const totKcal=h.reduce((a,s)=>a+s.kcal,0);
  const avgPct=Math.round(h.reduce((a,s)=>a+(s.total>0?s.done/s.total*100:0),0)/h.length);
  let out=`<div style="font-family:'Bebas Neue',sans-serif;font-size:26px;margin-bottom:4px">HISTORICO</div>
  <div style="font-size:11px;color:var(--muted);margin-bottom:18px">${h.length} sessoes registradas</div>
  <div class="week-summary">
    <div class="ws-card"><div class="ws-val" style="color:var(--green)">${h.length}</div><div class="ws-lbl">Sessoes</div></div>
    <div class="ws-card"><div class="ws-val" style="color:var(--orange)">${totKcal.toLocaleString('pt-BR')}</div><div class="ws-lbl">Kcal totais</div></div>
    <div class="ws-card"><div class="ws-val" style="color:var(--blue)">${avgPct}%</div><div class="ws-lbl">Conclusao media</div></div>
  </div>
  <button class="clear-hist-btn" onclick="if(confirm('Apagar historico?')){localStorage.removeItem('leo_h');renderHistory();}">Limpar historico</button>`;
  h.forEach(s=>{
    const pct=s.total>0?Math.round(s.done/s.total*100):100;
    out+=`<div class="hist-card">
      <div class="hist-date">${s.date}</div>
      <div class="hist-type">${s.type}</div>
      <div><span class="hist-badge hb-done">${s.workout}</span>${s.pains&&s.pains.length?`<span class="hist-badge hb-pain">Dor: ${s.pains.join(', ')}</span>`:''}</div>
      <div class="comp-bar-wrap" style="margin:10px 0 0"><div class="comp-bar"><div class="comp-fill" style="width:${pct}%"></div></div>
        <div class="comp-text"><span>${s.done}/${s.total} exercicios</span><span>${pct}%</span></div>
      </div>
      <div class="hist-stats">
        <div><div class="hist-stat-val">${s.kcal}</div><div class="hist-stat-lbl">kcal</div></div>
        <div><div class="hist-stat-val">${s.duration}</div><div class="hist-stat-lbl">minutos</div></div>
        <div><div class="hist-stat-val">${s.done}</div><div class="hist-stat-lbl">exercicios</div></div>
      </div>
    </div>`;
  });
  wrap.innerHTML=out;
}
</script>
</body>
</html>

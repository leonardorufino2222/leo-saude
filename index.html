<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b10"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Leo Saude"/>
<link rel="manifest" href="manifest.json"/>
<title>Leo Saude</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>

:root{
  --bg:#0b0b10;--bg2:#14141c;--bg3:#1e1e2a;--bg4:#272735;
  --a:#00e5a0;--a2:#00b8ff;--a3:#ff6b6b;--aw:#ffb347;--ap:#b085f5;
  --t:#f0f0f8;--t2:#8888a8;--t3:#55556a;--br:#28283a;
  --r:14px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:'Syne',sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;position:relative}
/* TOP */
.topbar{padding:calc(var(--st) + 14px) 18px 12px;background:var(--bg);border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
.tt{font-size:15px;font-weight:700}
.td{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3)}
.tlogo{width:30px;height:30px;background:var(--a);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#000;font-family:'DM Mono',monospace}
/* SCROLL */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sb) + 85px)}
/* NAV */
.nav{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--br);display:flex;padding-bottom:var(--sb);z-index:10}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border:none;background:transparent;cursor:pointer;color:var(--t3);transition:color .15s}
.nb.act{color:var(--a)}
.nb svg{width:20px;height:20px;stroke-width:1.8}
.nb span{font-size:9px;font-family:'DM Mono',monospace}
/* PAGE */
.page{display:none;padding:14px}
.page.act{display:block}
/* CARD */
.card{background:var(--bg2);border:1px solid var(--br);border-radius:var(--r);padding:14px;margin-bottom:10px}
.ct{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
/* METRICS */
.m2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.m4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.met{background:var(--bg3);border-radius:10px;padding:12px 10px;border:1px solid var(--br)}
.mv{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;line-height:1}
.mu{font-size:10px;color:var(--t3);margin-left:1px}
.ml{font-size:10px;color:var(--t2);margin-top:4px}
.ms{font-size:10px;color:var(--t3);margin-top:1px}
.ca .mv{color:var(--a)}.cb .mv{color:var(--a2)}.cw .mv{color:var(--aw)}.cr .mv{color:var(--a3)}.cp .mv{color:var(--ap)}
/* PROGRESS */
.pb{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:5px}
.pf{height:100%;border-radius:3px;transition:width .5s}
/* BIG INPUT */
.biw{background:var(--bg3);border:1px solid var(--br);border-radius:var(--r);padding:18px;margin-bottom:10px;text-align:center}
.bip{background:transparent;border:none;outline:none;font-family:'DM Mono',monospace;font-size:50px;font-weight:500;color:var(--a);width:100%;text-align:center;-moz-appearance:textfield}
.bip::-webkit-outer-spin-button,.bip::-webkit-inner-spin-button{-webkit-appearance:none}
.bip::placeholder{color:var(--t3)}
.bil{font-size:11px;color:var(--t3);margin-bottom:6px;font-family:'DM Mono',monospace}
.biu{font-size:14px;color:var(--t3);margin-top:3px}
/* BUTTONS */
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Syne',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.bp{background:var(--a);color:#000}
.bs{background:var(--bg3);color:var(--t);border:1px solid var(--br);margin-top:6px}
/* BADGE */
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-family:'DM Mono',monospace;font-weight:500}
.bg{background:rgba(0,229,160,.12);color:var(--a)}
.bb{background:rgba(0,184,255,.12);color:var(--a2)}
.br2{background:rgba(255,107,107,.12);color:var(--a3)}
.bw{background:rgba(255,179,71,.12);color:var(--aw)}
.bpp{background:rgba(176,133,245,.12);color:var(--ap)}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:6px 6px;color:var(--t3);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--br)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--br);color:var(--t);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
/* SECTION HDR */
.sh{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin:14px 0 7px;padding:0 2px}
/* IMC BAR */
.imcbar{height:10px;border-radius:5px;display:flex;overflow:hidden;margin:8px 0;position:relative}
/* ALERT */
.ali{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--br)}
.ali:last-child{border-bottom:none}
.alt{font-family:'DM Mono',monospace;font-size:11px;color:var(--a);min-width:50px;font-weight:500;padding-top:2px;flex-shrink:0}
.aln .ti{font-size:13px;color:var(--t);font-weight:600}
.aln .sw{font-size:11px;color:var(--t3);margin-top:2px}
/* CHECKLIST */
.chi{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--br);cursor:pointer}
.chi:last-child{border-bottom:none}
.chb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--br);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chb.dn{background:var(--a);border-color:var(--a)}
.chl{font-size:13px;color:var(--t);line-height:1.4}
.chl.dn{color:var(--t3);text-decoration:line-through}
.chs{font-family:'DM Mono',monospace;font-size:10px;color:var(--a2);margin-top:1px}
.chn{font-size:11px;color:var(--t3);margin-top:1px}
/* PHASE TABS */
.ptabs{display:flex;gap:5px;margin-bottom:10px}
.pt{flex:1;padding:7px 3px;border-radius:8px;border:1px solid var(--br);background:var(--bg3);text-align:center;cursor:pointer;font-size:10px;font-weight:600;color:var(--t3);transition:all .15s;font-family:'DM Mono',monospace}
.pt.act{background:var(--a);color:#000;border-color:var(--a)}
/* TRAIN SELECTOR */
.tsel{display:flex;gap:7px;overflow-x:auto;padding-bottom:7px;margin-bottom:10px;scrollbar-width:none}
.tsel::-webkit-scrollbar{display:none}
.tc{flex-shrink:0;padding:8px 14px;border-radius:10px;border:1px solid var(--br);background:var(--bg3);cursor:pointer;font-size:12px;font-weight:600;color:var(--t3);transition:all .15s;white-space:nowrap}
.tc.act{background:var(--a2);color:#000;border-color:var(--a2)}
/* TAB PILLS */
.tpills{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tpills::-webkit-scrollbar{display:none}
.tpill{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1px solid var(--br);background:var(--bg3);cursor:pointer;font-size:11px;font-weight:600;color:var(--t3);transition:all .15s;white-space:nowrap}
.tpill.act{background:var(--a);color:#000;border-color:var(--a)}
/* HIST */
.hi{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--br)}
.hi:last-child{border-bottom:none}
.hd{font-family:'DM Mono',monospace;font-size:11px;color:var(--t3)}
.hw{font-family:'DM Mono',monospace;font-size:17px;color:var(--t);font-weight:500}
.hdl{font-family:'DM Mono',monospace;font-size:11px}
/* MEAL */
.mr{padding:9px 0;border-bottom:1px solid var(--br)}
.mr:last-child{border-bottom:none}
.mtime{font-family:'DM Mono',monospace;font-size:10px;color:var(--a);margin-bottom:2px}
.mname{font-size:13px;font-weight:600;color:var(--t)}
.mdesc{font-size:11px;color:var(--t3);margin-top:2px;line-height:1.5}
.mkcal{font-family:'DM Mono',monospace;font-size:11px;color:var(--aw);margin-top:3px}
/* AVOID */
.avi{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--br);font-size:12px;color:var(--t3)}
.avi:last-child{border-bottom:none}
/* MACRO BAR */
.mbw{margin-bottom:8px}
.mbl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px}
.mbn{color:var(--t2)}.mbv{font-family:'DM Mono',monospace;color:var(--t3)}
/* SUPP */
.si{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--br)}
.si:last-child{border-bottom:none}
.sn{font-size:12px;color:var(--t);font-weight:600}
.sd{font-size:10px;color:var(--t3);margin-top:2px}
.sdose{font-family:'DM Mono',monospace;font-size:11px;color:var(--a2);text-align:right;flex-shrink:0;margin-left:8px;padding-top:2px}
/* TOAST */
.toast{position:fixed;top:calc(var(--st) + 66px);left:50%;transform:translateX(-50%) translateY(-16px);background:var(--bg3);border:1px solid var(--a);color:var(--a);padding:9px 18px;border-radius:10px;font-size:12px;font-weight:600;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* RESP BREATH */
.bcirc{width:120px;height:120px;border-radius:50%;border:3px solid var(--a);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:16px auto;transition:transform 1s,border-color 1s;background:rgba(0,229,160,.06)}
.bcirc.expand{transform:scale(1.3);border-color:var(--a2);background:rgba(0,184,255,.08)}
.bcirc.hold{border-color:var(--ap);background:rgba(176,133,245,.08)}


/* TREINO DINAMICO */
.pain-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}
.pain-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--br);border-radius:8px;padding:8px 10px;cursor:pointer;transition:all .2s}
.pain-item.checked{border-color:var(--a3);background:rgba(255,107,107,.07)}
.pain-dot{font-size:14px;flex-shrink:0}
.pain-name{font-size:11px;font-weight:600;flex:1;line-height:1.2}
.pain-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--t3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px}
.pain-item.checked .pain-check{background:var(--a3);border-color:var(--a3);color:#fff}
.day-sel{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.day-sel::-webkit-scrollbar{display:none}
.dsb{flex-shrink:0;padding:6px 10px;border-radius:8px;border:1px solid var(--br);background:var(--bg3);color:var(--t3);font-family:'DM Mono',monospace;font-size:10px;font-weight:600;cursor:pointer;text-align:center;line-height:1.4}
.dsb.act{background:rgba(0,229,160,.12);border-color:var(--a);color:var(--a)}
.dsb.rest-d.act{background:rgba(85,85,106,.15);border-color:var(--t3);color:var(--t)}
.status-row{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--br);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.sr-main{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--a);line-height:1}
.sr-main.red{color:var(--a3)}.sr-main.yellow{color:var(--aw)}
.sr-sub{font-size:10px;color:var(--t3);margin-top:2px}
.comp-bar{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-bottom:3px}
.comp-fill{height:100%;background:linear-gradient(90deg,var(--a),#d4ff7a);border-radius:2px;transition:width .4s}
.comp-txt{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-bottom:10px}
.ex-card{background:var(--bg3);border:1px solid var(--br);border-radius:10px;overflow:hidden;margin-bottom:7px}
.ex-card.blocked{opacity:.3;border-color:rgba(255,107,107,.2)}
.ex-card.substituted{border-color:rgba(255,179,71,.25)}
.ex-hdr{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.ex-num{width:26px;height:26px;border-radius:6px;background:rgba(0,229,160,.1);color:var(--a);font-family:'DM Mono',monospace;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-card.blocked .ex-num{background:rgba(255,107,107,.1);color:var(--a3)}
.ex-card.substituted .ex-num{background:rgba(255,179,71,.1);color:var(--aw)}
.ex-inf{flex:1;min-width:0}
.ex-nm{font-weight:600;font-size:12px;line-height:1.2}
.ex-card.blocked .ex-nm{text-decoration:line-through;color:var(--t3)}
.ex-mt{display:flex;gap:6px;margin-top:3px;align-items:center;flex-wrap:wrap}
.ex-sets{font-size:10px;color:var(--t3)}
.ex-tag{font-size:9px;font-weight:700;letter-spacing:.5px;padding:1px 6px;border-radius:20px;text-transform:uppercase}
.tg-g{background:rgba(0,229,160,.12);color:var(--a)}.tg-r{background:rgba(255,107,107,.12);color:var(--a3)}.tg-y{background:rgba(255,179,71,.12);color:var(--aw)}
.ex-arr{font-size:10px;color:var(--t3);transition:transform .2s;flex-shrink:0}.ex-arr.open{transform:rotate(180deg)}
.ex-body{display:none;border-top:1px solid var(--br)}.ex-body.open{display:block}
.ex-svg{padding:12px;text-align:center;background:rgba(0,0,0,.2)}
.ex-svg svg{max-width:240px;width:100%;border-radius:6px}
.ex-tip{font-size:11px;color:var(--t3);margin-top:6px;line-height:1.5}
.ex-reason{padding:7px 12px 8px;font-size:10px;color:var(--a3)}
.ex-sub-r{padding:7px 12px 8px;font-size:10px;color:var(--aw)}
.ex-done-btn{margin:8px 12px 10px;padding:9px;background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.2);color:var(--a);border-radius:8px;cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;font-weight:600;width:calc(100% - 24px)}
.ex-done-btn.done{background:rgba(0,229,160,.2);border-color:var(--a)}
.save-sess-btn{width:100%;margin-top:10px;padding:12px;background:rgba(0,229,160,.12);border:1px solid var(--a);color:var(--a);border-radius:10px;cursor:pointer;font-family:'Syne',sans-serif;font-size:13px;font-weight:700}
.ws-strip{border-radius:8px;padding:9px 12px;margin-bottom:10px;border-left:3px solid;font-size:11px;display:flex;gap:8px}
.ws-r{background:rgba(255,107,107,.08);border-color:var(--a3)}
.ws-g{background:rgba(0,229,160,.08);border-color:var(--a)}
.ws-y{background:rgba(255,179,71,.08);border-color:var(--aw)}
.hc{background:var(--bg3);border:1px solid var(--br);border-radius:10px;padding:14px;margin-bottom:8px}
.hc-date{font-family:'DM Mono',monospace;font-size:13px;color:var(--a);margin-bottom:2px}
.hc-type{font-size:10px;color:var(--t3);margin-bottom:8px}
.hbadge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-block;margin:2px}
.hb-ok{background:rgba(0,229,160,.12);color:var(--a)}.hb-pain{background:rgba(255,179,71,.12);color:var(--aw)}
.h3grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.h3c{background:var(--bg3);border:1px solid var(--br);border-radius:10px;padding:12px;text-align:center}
.h3v{font-family:'DM Mono',monospace;font-size:24px;color:var(--aw)}
.h3l{font-size:10px;color:var(--t3);margin-top:2px}

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div><div class="tt">Leo Saúde 💪</div><div class="td" id="topdate"></div></div>
    <div class="tlogo">L</div>
  </div>
  <div class="content" id="content"></div>
  <nav class="nav">
    <button class="nb act" onclick="go('home')" id="nv-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Início</span>
    </button>
    <button class="nb" onclick="go('log')" id="nv-log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Registrar</span>
    </button>
    <button class="nb" onclick="go('treino')" id="nv-treino">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 9l2 3-2 3M22 9l-2 3 2 3"/></svg><span>Treino</span>
    </button>
    <button class="nb" onclick="go('nutri')" id="nv-nutri">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/><circle cx="12" cy="9" r="2.5"/></svg><span>Nutrição</span>
    </button>
    <button class="nb" onclick="go('mais')" id="nv-mais">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg><span>Mais</span>
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>


<script>

// ======= CONSTANTS =======
const PI=94, AL=1.79, PM=78, DI='2026-05-18';
const TMB=1897, TDEE=2466;

// ======= STATE =======
let S={logs:[],ph:0,tr:'A',nt:'treino',st:'alertas',sE:0,sS:0};
function ls(){try{const s=localStorage.getItem('lv5');if(s)S={...S,...JSON.parse(s)}}catch(e){}}
function ss(){localStorage.setItem('lv5',JSON.stringify(S))}
ls();

// ======= HELPERS =======
function td(){return new Date().toISOString().slice(0,10)}
function fd(d){return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}
function imc(p){return (p/(AL*AL)).toFixed(1)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function lp(){const l=S.logs.length?S.logs[S.logs.length-1]:null;return l?l.peso:PI}
function wk(){return Math.min(12,Math.max(1,Math.ceil((new Date()-new Date(DI))/(7*864e5))))}
function dayT(){const d=new Date().getDay();return{0:'REST',1:'A',2:'BIKE',3:'REST',4:'B',5:'C',6:'BIKE'}[d]}
function dayKcal(){const t=dayT();if(t==='REST')return{k:1750,l:'Descanso',c:'var(--t3)'};if(t==='BIKE')return{k:1900,l:'Bicicleta',c:'var(--ap)'};return{k:1950,l:'Treino '+t,c:'var(--a)'}}

// ======= NAV =======
let CP='home';
function go(p){CP=p;document.querySelectorAll('.nb').forEach(b=>b.classList.remove('act'));document.getElementById('nv-'+p).classList.add('act');render()}

// ======= RENDER =======
function render(){
  document.getElementById('topdate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
  const c=document.getElementById('content');
  if(CP==='home')c.innerHTML=rHome();
  else if(CP==='log')c.innerHTML=rLog();
  else if(CP==='treino'){c.innerHTML=rTreinoDin();return;}
  else if(CP==='nutri')c.innerHTML=rNutri();
  else if(CP==='mais')c.innerHTML=rMais();
  attachEv();
}

// ======= HOME =======
function rHome(){
  const peso=lp(), iv=parseFloat(imc(peso));
  const perd=Math.max(0,Math.round((PI-peso)*10)/10);
  const pct=Math.min(100,Math.round(perd/(PI-PM)*100));
  const sem=wk(), sp=Math.round(sem/12*100);
  const ip=Math.min(98,Math.max(2,((iv-16)/(40-16))*100));
  const di=dayKcal();
  const logs=S.logs.slice(-5).reverse();
  const h=new Date().getHours();

  // day alerts
  const alls=[

function saveL(){
  const p=parseFloat(document.getElementById('ip').value);

}

function startBreath(){
  clearTimeout(bTimer);bStep=0;
  const steps=[{t:'Inspirar',d:4000,c:'expand'},{t:'Prender',d:7000,c:'hold'},{t:'Expirar',d:8000,c:''}];
  let sec=0,cur=0;
  function tick(){
    const s=steps[cur];
    const c=document.getElementById('bcirc');
    const bs=document.getElementById('bstate');
    const bc=document.getElementById('bcount');
    if(!c)return;
    c.className='bcirc '+(s.c||'');
    bs.textContent=s.t;
    const rem=Math.ceil((s.d-sec*1000)/1000);
    bc.textContent=rem+'s';
    sec++;
    if(sec*1000>=s.d){sec=0;cur=(cur+1)%3;}
    bTimer=setTimeout(tick,1000);
  }
  tick();
}
function stopBreath(){
  clearTimeout(bTimer);
  const c=document.getElementById('bcirc');const bs=document.getElementById('bstate');const bc=document.getElementById('bcount');
  if(c){c.className='bcirc';bs.textContent='Pronto';bc.textContent='4-7-8';}
}

  if(CP==='log'){
    const tl=S.logs.find(l=>l.date===td());
    if(tl){if(tl.energia)sN('sE',tl.energia);if(tl.sono)sN('sS',tl.sono);}
    else{if(S.sE)sN('sE',S.sE);if(S.sS)sN('sS',S.sS);}
  }
}

// ===== TREINO DINAMICO =====
let painOpen = true;   // pain panel collapsed state
let treinoGerado = false; // workout generated?

function renderTreino(){
  document.getElementById('content').innerHTML = rTreinoDin();
}

function gerarTreino(){
  treinoGerado = true;
  painOpen = false;
  renderTreino();
}

function concluirTreino(){
  const wk = WORKOUTS[WEEK_MAP[selDay]];
  const active = wk.exercises.filter(ex => ex.risks.filter(r => activePain.has(r)).length === 0 || ex.sub);
  const h = getTH();
  const now = new Date();
  h.unshift({
    date: now.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'}) + ' ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
    ts: now.getTime(), workout: wk.label, type: wk.type,
    done: doneEx.size, total: active.length,
    kcal: wk.kcal, duration: wk.duration,
    pains: [...activePain].map(pid => PAIN_ZONES.find(z => z.id === pid)?.name).filter(Boolean)
  });
  if(h.length > 60) h.pop();
  saveTH(h);
  // Reset for next time
  doneEx.clear(); openCards.clear();
  treinoGerado = false; painOpen = true;
  renderTreino();
  toast('Treino salvo!');
}

function togglePain(id){
  if(activePain.has(id)) activePain.delete(id); else activePain.add(id);
  doneEx.clear(); openCards.clear();
  treinoGerado = false;
  renderTreino();
}
function clearPain(){ activePain.clear(); doneEx.clear(); openCards.clear(); treinoGerado=false; renderTreino(); }
function selDayFn(i){ selDay=i; doneEx.clear(); openCards.clear(); treinoGerado=false; renderTreino(); }
function togglePainPanel(){ painOpen=!painOpen; renderTreino(); }
function toggleCard(id){ if(openCards.has(id)) openCards.delete(id); else openCards.add(id); renderTreino(); }
function toggleDone(e,id){ e.stopPropagation(); if(doneEx.has(id)) doneEx.delete(id); else doneEx.add(id); renderTreino(); }

function rTreinoDin(){
  const wkey = WEEK_MAP[selDay];
  const wk = WORKOUTS[wkey];
  const painNames = [...activePain].map(pid => PAIN_ZONES.find(z => z.id === pid)?.name).filter(Boolean);

  let html = '<div class="page act">';

  // ── DAY SELECTOR ──
  html += '<div class="day-sel">';
  DAY_SHORT.forEach((d,i) => {
    const k = WEEK_MAP[i], isAct = i===selDay, isRest = k==='REST';
    html += `<button class="dsb${isAct?' act':''}${isRest?' rest-d':''}" onclick="selDayFn(${i})">${d}<br><span style="font-size:8px;opacity:.6">${isRest?'desc':k==='BIKE'?'bike':'treino'}</span></button>`;
  });
  html += '</div>';

  // ── PAIN PANEL ──
  const hasPain = activePain.size > 0;
  html += `<div class="card" style="margin-bottom:10px">`;
  html += `<div onclick="togglePainPanel()" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">`;
  html += `<div class="ct" style="margin-bottom:0">O que doi hoje?${hasPain ? ` <span style="color:var(--a3);font-size:10px">(${activePain.size} marcado)</span>` : ''}</div>`;
  html += `<span style="color:var(--t3);font-size:14px;transition:transform .2s;display:inline-block;transform:rotate(${painOpen?'180':'0'}deg)">▼</span>`;
  html += `</div>`;

  if(painOpen){
    html += '<div style="margin-top:10px"><div class="pain-grid">';
    PAIN_ZONES.forEach(z => {
      const chk = activePain.has(z.id);
      html += `<div class="pain-item${chk?' checked':''}" onclick="togglePain('${z.id}')">`;
      html += `<span class="pain-dot">${z.emoji}</span>`;
      html += `<span class="pain-name">${z.name}</span>`;
      html += `<span class="pain-check">${chk?'✓':''}</span>`;
      html += `</div>`;
    });
    html += '</div>';
    if(hasPain) html += `<button onclick="clearPain()" style="width:100%;padding:7px;border-radius:7px;border:1px solid var(--br);background:transparent;color:var(--t3);font-family:Syne,sans-serif;font-size:11px;cursor:pointer;margin-top:8px">Limpar selecao</button>`;
    // CRIAR TREINO button
    html += `<button onclick="gerarTreino()" style="width:100%;margin-top:8px;padding:12px;border-radius:10px;border:none;background:var(--a);color:#000;font-family:Syne,sans-serif;font-size:14px;font-weight:700;cursor:pointer">Criar Treino →</button>`;
    html += '</div>';
  }
  html += '</div>';

  // ── REST DAY ──
  if(wkey === 'REST'){
    html += '<div class="card"><div style="font-family:Syne,sans-serif;font-size:18px;font-weight:700;color:var(--t3);margin-bottom:6px">DESCANSO</div>';
    html += '<p style="font-size:12px;color:var(--t3);margin-bottom:10px">Recuperacao e onde o corpo muda.</p>';
    if(hasPain) html += '<div class="ws-strip ws-y"><span>💡</span><div>Dores marcadas. Gelo 15min. Evite cargas.</div></div>';
    html += '<div class="ct" style="margin-top:8px">Mobilidade opcional</div>';
    [{n:'Cat-Cow',s:'2x10',f:'Lombar'},{n:'Hip 90/90',s:'2x45s cada',f:'Quadril'},{n:'Couch Stretch',s:'2x45s cada',f:'Iliopsoas'},{n:'Deadbug',s:'2x8 cada',f:'Core'},{n:'Circulos tornozelo',s:'2x15 cada',f:'Tornozelo'}].forEach(m => {
      html += `<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--br)"><div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--a);min-width:70px">${m.s}</div><div><div style="font-size:12px">${m.n}</div><div style="font-size:10px;color:var(--t3)">${m.f}</div></div></div>`;
    });
    html += '</div></div>';
    return html;
  }

  // ── TREINO NOT GENERATED YET ──
  if(!treinoGerado){
    html += `<div class="card" style="text-align:center;padding:28px 16px">`;
    html += `<div style="font-size:32px;margin-bottom:10px">💪</div>`;
    html += `<div style="font-family:Syne,sans-serif;font-size:16px;font-weight:700;margin-bottom:6px">Pronto para treinar?</div>`;
    html += `<div style="font-size:12px;color:var(--t3);margin-bottom:16px">Marque o que doi acima e clique em Criar Treino.<br>Se nao doi nada, clique diretamente.</div>`;
    html += `<button onclick="gerarTreino()" style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--a);color:#000;font-family:Syne,sans-serif;font-size:15px;font-weight:700;cursor:pointer">Criar Treino →</button>`;
    html += `</div>`;
    html += '</div>';
    return html;
  }

  // ── WORKOUT GENERATED ──
  const analyzed = wk.exercises.map(ex => {
    const conf = ex.risks.filter(r => activePain.has(r));
    return Object.assign({}, ex, {status: conf.length===0 ? 'safe' : (ex.sub ? 'substituted' : 'blocked')});
  });
  const blocked = analyzed.filter(e => e.status==='blocked').length;
  const subst   = analyzed.filter(e => e.status==='substituted').length;
  const active  = analyzed.filter(e => e.status!=='blocked');
  const allBlocked = active.length===0 && wk.exercises.length>0;

  let sText = wk.label, sClass = '';
  if(hasPain && allBlocked){ sText='BLOQUEADO'; sClass='red'; }
  else if(hasPain && (blocked>0||subst>0)){ sText=wk.label+' ADAPTADO'; sClass='yellow'; }

  html += `<div class="status-row">
    <div style="font-size:20px">${hasPain&&allBlocked?'🚫':hasPain&&(blocked||subst)?'⚠️':'✅'}</div>
    <div>
      <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">${wk.type}</div>
      <div class="sr-main ${sClass}">${sText}</div>
      <div class="sr-sub">${wk.duration} min · ${wk.kcal} kcal</div>
    </div>
    <div style="margin-left:auto;text-align:right">
      <div style="font-family:'DM Mono',monospace;font-size:22px;color:var(--aw)">${doneEx.size}/${active.length}</div>
      <div style="font-size:10px;color:var(--t3)">feitos</div>
    </div>
  </div>`;

  if(hasPain) html += `<div class="ws-strip ws-r"><span>⚠️</span><div><strong>Dor: ${painNames.join(', ')}</strong> — ${blocked} removido · ${subst} substituido</div></div>`;
  if(allBlocked) html += '<div class="card"><div style="font-size:16px;font-weight:700;color:var(--a3);margin-bottom:6px">TREINO INCOMPATIVEL</div><div style="font-size:12px;color:var(--t3)">Opcoes: ergometrica 20 min ou mobilidade.</div></div>';

  if(!allBlocked){
    const pct = active.length ? Math.round(doneEx.size/active.length*100) : 0;
    html += `<div class="comp-bar"><div class="comp-fill" style="width:${pct}%"></div></div>`;
    html += `<div class="comp-txt"><span>Progresso</span><span>${doneEx.size}/${active.length} · ${pct}%</span></div>`;
    html += '<div style="font-size:10px;color:var(--t3);margin-bottom:8px">TOQUE NO EXERCICIO PARA VER COMO FAZER</div>';

    analyzed.forEach((ex,i) => {
      const isDone = doneEx.has(ex.id);
      const isOpen = openCards.has(ex.id);
      const nm = ex.status==='substituted' ? ex.sub.name : ex.name;
      const st = ex.status==='substituted' ? ex.sub.sets : ex.sets;
      const svgContent = SVG[ex.id] || SVG['default_ex'] || '';

      if(ex.status==='blocked'){
        const painList = ex.risks.filter(r=>activePain.has(r)).map(r=>PAIN_ZONES.find(z=>z.id===r)?.name).filter(Boolean).join(', ');
        html += `<div class="ex-card blocked">
          <div class="ex-hdr" style="cursor:default">
            <div class="ex-num">✕</div>
            <div class="ex-inf">
              <div class="ex-nm">${ex.name}</div>
              <div class="ex-mt"><span class="ex-sets">${ex.sets}</span><span class="ex-tag tg-r">BLOQUEADO</span></div>
            </div>
          </div>
          <div class="ex-reason">Agrava: ${painList}</div>
        </div>`;
        return;
      }

      html += `<div class="ex-card ${ex.status}">
        <div class="ex-hdr" onclick="toggleCard('${ex.id}')">
          <div class="ex-num" style="${isDone?'background:rgba(0,229,160,.18);color:var(--a)':''}">${isDone?'✓':i+1}</div>
          <div class="ex-inf">
            <div class="ex-nm" style="${isDone?'opacity:.45':''}">${nm}</div>
            <div class="ex-mt">
              <span class="ex-sets">${st} · ${ex.focus}</span>
              ${ex.status==='substituted'?'<span class="ex-tag tg-y">SUBSTITUTO</span>':'<span class="ex-tag tg-g">OK</span>'}
            </div>
          </div>
          <div style="font-size:14px;flex-shrink:0">${isDone?'✅':'○'}</div>
          <div class="ex-arr ${isOpen?'open':''}" style="margin-left:4px">▼</div>
        </div>`;

      if(isOpen){
        html += `<div class="ex-body open">`;
        if(ex.status==='substituted') html += `<div class="ex-sub-r">Substituido: ${ex.sub.reason}</div>`;
        html += `<div class="ex-svg" style="padding:14px;text-align:center;background:rgba(0,0,0,.25)">`;
        html += svgContent;
        html += `<div class="ex-tip" style="font-size:11px;color:var(--t3);margin-top:8px;line-height:1.5">${ex.tip||''}</div>`;
        html += `</div>`;
        html += `<button class="ex-done-btn ${isDone?'done':''}" onclick="toggleDone(event,'${ex.id}')">${isDone?'✅ Concluido — toque para desfazer':'✓ Marcar como feito'}</button>`;
        html += `</div>`;
      }

      html += `</div>`;
    });

    // TREINO CONCLUÍDO button - always visible during workout
    html += `<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--br)">`;
    if(doneEx.size===active.length && active.length>0){
      html += '<div class="ws-strip ws-g"><span>🎉</span><div><strong>Treino concluido!</strong> Proteina em ate 60 min.</div></div>';
    }
    html += `<button onclick="concluirTreino()" style="width:100%;padding:14px;border-radius:12px;border:${doneEx.size===active.length&&active.length>0?'none':'1px solid var(--br)'};background:${doneEx.size===active.length&&active.length>0?'var(--a)':'var(--bg3)'};color:${doneEx.size===active.length&&active.length>0?'#000':'var(--t3)'};font-family:Syne,sans-serif;font-size:14px;font-weight:700;cursor:pointer">`;
    html += doneEx.size===active.length&&active.length>0 ? '🏁 Treino Concluido — Salvar' : '⏭ Encerrar treino sem salvar';
    html += `</button></div>`;
  }

  // History
  const th = getTH();
  if(th.length > 0){
    const avgPct = Math.round(th.reduce((a,sv)=>a+(sv.total>0?sv.done/sv.total*100:0),0)/th.length);
    html += `<div class="sh">Historico</div>
    <div class="h3grid">
      <div class="h3c"><div class="h3v">${th.length}</div><div class="h3l">Sessoes</div></div>
      <div class="h3c"><div class="h3v">${th.reduce((a,sv)=>a+sv.kcal,0).toLocaleString('pt-BR')}</div><div class="h3l">Kcal</div></div>
      <div class="h3c"><div class="h3v">${avgPct}%</div><div class="h3l">Media</div></div>
    </div>`;
    th.slice(0,3).forEach(sv => {
      const p = sv.total>0 ? Math.round(sv.done/sv.total*100) : 100;
      html += `<div class="hc">
        <div class="hc-date">${sv.date}</div>
        <div class="hc-type">${sv.type}</div>
        <div><span class="hbadge hb-ok">${sv.workout}</span>${sv.pains&&sv.pains.length?`<span class="hbadge hb-pain">Dor: ${sv.pains.join(', ')}</span>`:''}</div>
        <div class="comp-bar" style="margin:8px 0 3px"><div class="comp-fill" style="width:${p}%"></div></div>
        <div class="comp-txt"><span>${sv.done}/${sv.total}</span><span>${p}%</span></div>
      </div>`;
    });
  }

  html += '</div>';
  return html;
}

</script>
</body>
</html>
